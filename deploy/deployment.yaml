apiVersion: v1
kind: Namespace
metadata:
  name: fabric-explorer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fabric-explorer
  namespace: fabric-explorer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fabric-explorer-reader
rules:
  - apiGroups: [sonic.networking.metal.ironcore.dev]
    resources: [switches]
    verbs: [get, list, watch]
  - apiGroups: [fabric.ironcore.dev]
    resources: [nodes, interfaces, cells]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fabric-explorer-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fabric-explorer-reader
subjects:
  - kind: ServiceAccount
    name: fabric-explorer
    namespace: fabric-explorer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabric-explorer
  namespace: fabric-explorer
spec:
  replicas: 1
  selector:
    matchLabels: {app: fabric-explorer}
  template:
    metadata:
      labels: {app: fabric-explorer}
    spec:
      serviceAccountName: fabric-explorer
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: explorer
          image: fabric-explorer:local
          imagePullPolicy: IfNotPresent
          args: ["--mode=live", "--in-cluster", "--listen=0.0.0.0:8080", "--poll-interval=5s", "--poll-timeout=4s"]
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: fabric-explorer
  namespace: fabric-explorer
spec:
  type: ClusterIP
  selector: {app: fabric-explorer}
  ports:
    - {name: http, port: 8080, targetPort: http}
