name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm --prefix web test
      - run: npm --prefix web run format:check
      - run: npm --prefix web run build
      - run: go build -trimpath -o bin/fabric-explorer ./cmd/fabric-explorer
      - run: python3 scripts/check-public-content.py
      - run: cd web && npx playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
